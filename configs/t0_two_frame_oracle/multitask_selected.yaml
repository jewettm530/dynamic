# EchoNet-Dynamic Stage 1 selected final multi-task baseline
# LOCKED after Step 2 using validation results only.
experiment:
  stage: 1
  task: multitask
  purpose: final_baseline
  reuse_step2_runs: true

data:
  root: /data/jewettm/dynamic/datasets
  cohort: common_ed_es_traced_videos
  expected_train_videos: 7460
  expected_validation_videos: 1288
  expected_test_videos: 1276

model:
  architecture: MultitaskDeepLabV3
  pretrained: true
  regression_hidden_dim: 256
  dropout: 0.3

training:
  epochs: 25
  batch_size: 4
  num_workers: 4
  optimizer: Adam
  learning_rate: 0.0001
  weight_decay: 0.0
  deterministic: true
  seeds: [42, 2026, 3407]

ef:
  training_target_scale: 0-1
  evaluation_scale: 0-100
  loss: MSELoss_mean

segmentation:
  loss: BCEWithLogitsLoss_mean
  threshold: 0.5

weighting:
  name: W2
  ef_weight: 0.5
  seg_weight: 0.5
  selection_basis: lowest_mean_validation_EF_MAE

checkpoint:
  rule: lowest_validation_EF_MAE
  same_checkpoint_for_both_tasks: true

reuse:
  source_root: output/stage1/T0_two_frame_oracle/weighting/W2
  note: Reuse is valid only because no training-relevant code, split, hyperparameter, epoch budget, or checkpoint rule changed after Step 2.
